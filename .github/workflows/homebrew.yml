name: Publish Homebrew cask
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Latest published stable tag to synchronize
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: homebrew-stable
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate published release tag
        run: node --input-type=module -e 'import {versionFromTag} from "./scripts/release/core.mjs"; versionFromTag(process.env.RELEASE_TAG);'
      - name: Download versioned release assets
        run: |
          mkdir -p "$RUNNER_TEMP/portglass-release"
          gh release download "$RELEASE_TAG" --pattern "Portglass-${RELEASE_TAG#v}-universal-macos.zip" --pattern release-manifest.json --dir "$RUNNER_TEMP/portglass-release"
      - name: Verify notarized application and checksum
        run: node scripts/release/artifact.mjs verify "${RELEASE_TAG#v}" "$RUNNER_TEMP/portglass-release"
      - name: Generate cask from verified bytes
        run: node scripts/release/publish-cask.mjs "$RELEASE_TAG" "$RUNNER_TEMP/portglass-release"
      - name: Validate cask with Homebrew
        run: node scripts/release/check-cask.mjs "$RUNNER_TEMP/portglass-release/portglass.rb"
      - name: Advance Homebrew to the latest stable release
        run: node scripts/release/publish-cask.mjs "$RELEASE_TAG" "$RUNNER_TEMP/portglass-release" --publish
