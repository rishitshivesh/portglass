name: macOS desktop checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run check
      - run: npm run check:rust
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run test:core
      - run: node scripts/desktop.mjs test:core --bin portglass
      - run: node scripts/desktop.mjs build --debug --no-bundle
