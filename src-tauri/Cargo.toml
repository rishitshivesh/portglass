[package]
name = "portglass"
version = "0.1.0"
edition = "2021"

[lib]
name = "portglass_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }

